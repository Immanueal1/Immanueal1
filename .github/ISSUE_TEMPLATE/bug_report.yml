name: 🐛 Bug Report
description: Report a broken asset, rendering error, or firmware bug.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the form below to help us reproduce and fix the issue.

  - type: input
    id: environment
    attributes:
      label: Operating System & Environment
      description: OS version, browser (Chrome/Firefox/Safari), or IDE (VS Code/PlatformIO).
      placeholder: e.g., Windows 11 / Chrome 120 / VS Code 1.85
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of what the bug is.
      placeholder: e.g., The SVG asset tech-stack.svg fails to display properly in dark mode.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Navigate to README.md
        2. Inspect Technical Skill Matrix image
        3. Observe misaligned icons on mobile viewport
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context & Screenshots
      description: Add any screenshot images, error logs, or terminal output here.
    validations:
      required: false
