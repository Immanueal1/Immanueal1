name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Runs daily at 18:00 UTC (23:30 IST / midnight local time)
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate 3D Contribution Graphs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push Generated 3D Calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --staged --quiet; then
            git commit -m "chore(3d-contrib): update 3d contribution calendar [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No 3D calendar changes to commit."
          fi
