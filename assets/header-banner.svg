<svg fill="none" viewBox="0 0 1200 300" width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset=".5" stop-color="#0D1324"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="line" x1="90" y1="40" x2="1110" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5D4"/>
      <stop offset=".5" stop-color="#0B84FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#25304A" stroke-opacity=".45" stroke-width="1"/>
    </pattern>
    <style>
      .label{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9FB3C8;letter-spacing:2px}
      .title{font:800 56px Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC}
      .sub{font:500 19px Inter,Segoe UI,Arial,sans-serif;fill:#C7D2E1}
      .chip{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E2E8F0}
      .trace{stroke:url(#line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:10 12;animation:dash 9s linear infinite}
      .pulse{animation:pulse 3.8s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-220}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="296" rx="16" stroke="url(#line)" stroke-opacity=".82" stroke-width="2"/>
  <path class="trace" d="M75 82h190l45 45h185m210 91h190l56-56h172"/>
  <path class="trace" d="M86 218h165l58-58h118m352-83h154l48 48h133" opacity=".75"/>
  <g filter="url(#glow)">
    <circle class="pulse" cx="75" cy="82" r="5" fill="#00F5D4"/>
    <circle class="pulse" cx="495" cy="127" r="5" fill="#0B84FF"/>
    <circle class="pulse" cx="705" cy="218" r="5" fill="#8B5CF6"/>
    <circle class="pulse" cx="1118" cy="162" r="5" fill="#00F5D4"/>
  </g>
  <g text-anchor="middle">
    <text x="600" y="88" class="label">EMBEDDED SYSTEMS  /  FIRMWARE  /  PCB DESIGN  /  EDGE AI</text>
    <text x="600" y="154" class="title">Krishna Kant Garhe</text>
    <text x="600" y="193" class="sub">Building intelligent hardware from circuit schematics to deployable firmware and ML pipelines</text>
  </g>
  <g transform="translate(600 248)" text-anchor="middle">
    <g transform="translate(-332)">
      <rect x="-66" y="-20" width="132" height="38" rx="10" fill="#111827" stroke="#00F5D4" stroke-opacity=".75"/>
      <text y="5" class="chip">ESP32</text>
    </g>
    <g transform="translate(-196)">
      <rect x="-66" y="-20" width="132" height="38" rx="10" fill="#111827" stroke="#0B84FF" stroke-opacity=".75"/>
      <text y="5" class="chip">RP2040</text>
    </g>
    <g transform="translate(-60)">
      <rect x="-66" y="-20" width="132" height="38" rx="10" fill="#111827" stroke="#8B5CF6" stroke-opacity=".75"/>
      <text y="5" class="chip">STM32</text>
    </g>
    <g transform="translate(76)">
      <rect x="-66" y="-20" width="132" height="38" rx="10" fill="#111827" stroke="#00F5D4" stroke-opacity=".75"/>
      <text y="5" class="chip">KiCad</text>
    </g>
    <g transform="translate(212)">
      <rect x="-66" y="-20" width="132" height="38" rx="10" fill="#111827" stroke="#0B84FF" stroke-opacity=".75"/>
      <text y="5" class="chip">TinyML</text>
    </g>
    <g transform="translate(348)">
      <rect x="-66" y="-20" width="132" height="38" rx="10" fill="#111827" stroke="#8B5CF6" stroke-opacity=".75"/>
      <text y="5" class="chip">BMS</text>
    </g>
  </g>
</svg>
