<svg fill="none" viewBox="0 0 1100 250" width="1100" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1100" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D16"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="166" y1="42" x2="922" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <style>
      .wire{stroke:url(#accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:9 12;animation:flow 8s linear infinite}
      .small{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#B5B8C5}
      .title{font:800 16px Inter,Segoe UI,Arial,sans-serif;fill:#E5F6FF}
      .pin{fill:#22D3EE;animation:blink 2.4s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-210}}
      @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect x="1" y="1" width="1098" height="248" rx="18" fill="url(#panel)" stroke="#8B5CF6"/>
  <path class="wire" d="M151 125H333M450 125h198M765 125h184"/>
  <path class="wire" d="M243 82h154l74 86h160l74-86h154" opacity=".55"/>
  <g transform="translate(76 62)">
