    <text x="81" y="76" text-anchor="middle" class="title">MCU</text>
    <text x="81" y="100" text-anchor="middle" class="small">ESP32 / RP2040</text>
    <g>
      <circle class="pin" cx="18" cy="42" r="3"/><circle class="pin" cx="18" cy="66" r="3"/><circle class="pin" cx="18" cy="90" r="3"/><circle class="pin" cx="18" cy="114" r="3"/>
      <circle class="pin" cx="144" cy="42" r="3"/><circle class="pin" cx="144" cy="66" r="3"/><circle class="pin" cx="144" cy="90" r="3"/><circle class="pin" cx="144" cy="114" r="3"/>
    </g>
  </g>
  <g transform="translate(642 62)">
    <rect width="150" height="126" rx="18" fill="#18162A" stroke="#334155"/>
    <text x="75" y="38" text-anchor="middle" class="title">Edge ML</text>
