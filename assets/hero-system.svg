    <text x="75" y="66" text-anchor="middle" class="small">NIR • AFE • ADC</text>
    <circle class="pin" cx="38" cy="94" r="6"/>
    <circle class="pin" cx="75" cy="94" r="6"/>
    <circle class="pin" cx="112" cy="94" r="6"/>
  </g>
  <g transform="translate(332 42)">
