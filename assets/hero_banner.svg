<svg fill="none" viewBox="0 0 1200 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#0B84FF"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B84FF" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#00F5D4" fill-opacity="0.3"/>
    </pattern>
    
    <style>
      .title { font-family: 'Fira Code', 'Inter', 'Segoe UI', sans-serif; font-weight: 800; font-size: 46px; fill: #FFFFFF; }
      .subtitle { font-family: 'Fira Code', 'Inter', 'Segoe UI', sans-serif; font-weight: 600; font-size: 20px; fill: #00F5D4; letter-spacing: 2px; }
      .badge-text { font-family: 'Fira Code', 'Segoe UI', sans-serif; font-weight: 600; font-size: 13px; fill: #E2E8F0; }
      .circuit-line { stroke: #00F5D4; stroke-width: 1.5; stroke-opacity: 0.4; fill: none; stroke-dasharray: 6 4; }
      .glow { filter: drop-shadow(0px 0px 10px rgba(0, 245, 212, 0.5)); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-gradient)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Glowing Accent Border -->
  <rect x="2" y="2" width="1196" height="336" rx="14" fill="none" stroke="url(#cyan-blue)" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Circuit Traces / Tech Aesthetics -->
  <path d="M 50 50 L 250 50 L 300 100 L 550 100" class="circuit-line"/>
  <circle cx="50" cy="50" r="4" fill="#00F5D4" class="glow"/>
  <circle cx="550" cy="100" r="4" fill="#0B84FF" class="glow"/>

  <path d="M 1150 290 L 950 290 L 900 240 L 700 240" class="circuit-line"/>
  <circle cx="1150" cy="290" r="4" fill="#7B2CBF" class="glow"/>
  <circle cx="700" cy="240" r="4" fill="#00F5D4" class="glow"/>

  <!-- Glowing Header Elements -->
  <g transform="translate(600, 110)" text-anchor="middle">
    <!-- Subtitle / Role Tagline -->
    <text y="-25" class="subtitle glow">⚡ ELECTRONICS &amp; EMBEDDED SYSTEMS ENGINEER ⚡</text>
    
    <!-- Main Name -->
    <text y="35" class="title">KRISHNA KANT GARHE</text>

    <!-- Core Domains Line -->
    <text y="75" font-family="'Fira Code', monospace" font-size="16" fill="#94A3B8" letter-spacing="1">
      Embedded C/C++ &nbsp;|&nbsp; Custom PCB Design &nbsp;|&nbsp; Edge AI &nbsp;|&nbsp; BMS &amp; Power
    </text>
  </g>

  <!-- Tech Chips / Pills at Bottom -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- Chip 1: ESP32 -->
    <g transform="translate(-360, 0)">
      <rect x="-60" y="-18" width="120" height="34" rx="17" fill="#1E293B" stroke="#00F5D4" stroke-width="1"/>
      <text class="badge-text" text-anchor="middle" y="5">ESP32 / S3</text>
    </g>
    <!-- Chip 2: RP2040 -->
    <g transform="translate(-210, 0)">
      <rect x="-60" y="-18" width="120" height="34" rx="17" fill="#1E293B" stroke="#0B84FF" stroke-width="1"/>
      <text class="badge-text" text-anchor="middle" y="5">RP2040 PIO</text>
    </g>
    <!-- Chip 3: STM32 -->
    <g transform="translate(-60, 0)">
      <rect x="-60" y="-18" width="120" height="34" rx="17" fill="#1E293B" stroke="#7B2CBF" stroke-width="1"/>
      <text class="badge-text" text-anchor="middle" y="5">STM32 ARM</text>
    </g>
    <!-- Chip 4: KiCad -->
    <g transform="translate(90, 0)">
      <rect x="-60" y="-18" width="120" height="34" rx="17" fill="#1E293B" stroke="#00F5D4" stroke-width="1"/>
      <text class="badge-text" text-anchor="middle" y="5">KiCad EDA</text>
    </g>
    <!-- Chip 5: Edge ML -->
    <g transform="translate(240, 0)">
      <rect x="-60" y="-18" width="120" height="34" rx="17" fill="#1E293B" stroke="#0B84FF" stroke-width="1"/>
      <text class="badge-text" text-anchor="middle" y="5">Edge ML</text>
    </g>
    <!-- Chip 6: FreeRTOS -->
    <g transform="translate(380, 0)">
      <rect x="-60" y="-18" width="120" height="34" rx="17" fill="#1E293B" stroke="#7B2CBF" stroke-width="1"/>
      <text class="badge-text" text-anchor="middle" y="5">FreeRTOS</text>
    </g>
  </g>
</svg>